name: Orion Key Demo Deployment

on:
  push:
    branches: [demo]
  workflow_dispatch:

# Application images stay on the demo server; no package or release access is needed.
permissions:
  contents: read

concurrency:
  group: orion-key-demo-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/demo'
    runs-on: [self-hosted, demo]
    timeout-minutes: 60
    env:
      DEPLOY_DIR: /opt/orion-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker compose version
          command -v mvn
          test -w "$DEPLOY_DIR"
          test -r "$DEPLOY_DIR/.env"
          test -w "$DEPLOY_DIR/.env"

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Build local API image
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -DskipTests \
            -Djib.to.image="orion-key-demo-api:${GITHUB_SHA}" \
            compile jib:dockerBuild

      - name: Build local Web image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.web \
            -t "orion-key-demo-web:${GITHUB_SHA}" \
            .

      - name: Deploy local images
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          # Update deployment files only after both images have built successfully.
          cp docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.yml"
          cp apps/api/src/main/resources/data.sql "$DEPLOY_DIR/data.sql"

          cd "$DEPLOY_DIR"
          sed -i '/^API_IMAGE=/d; /^WEB_IMAGE=/d' .env
          printf '\nAPI_IMAGE=orion-key-demo-api:%s\n' "$GITHUB_SHA" >> .env
          printf 'WEB_IMAGE=orion-key-demo-web:%s\n' "$GITHUB_SHA" >> .env

          # Only run the demo application; do not pull images or start the live payment gateway.
          docker compose up -d --pull never api web
          docker compose ps
